# The database `npm run dev` expects. `docker compose up -d db`, then
# `npm run db:migrate` to create the tables.
#
# Development only - nothing here is tuned or secured for anything else, and the
# credentials match the throwaway ones committed in .env.development.
services:
  db:
    image: postgres:17-alpine
    container_name: jwt-prisma-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jwt_prisma_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jwt_prisma_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
