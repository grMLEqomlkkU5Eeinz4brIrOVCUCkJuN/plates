# Lints, typechecks, builds and tests the project against a real Postgres.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: CI
on:
    push:
        branches: ["master", "main", "dev"]
        paths-ignore:
            - "**.md"
    pull_request:
        branches: ["master", "main", "dev"]
        paths-ignore:
            - "**.md"
    workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Lint, typecheck and build once, on the project's pinned Node version.
    # `npm ci` runs `prisma generate` through postinstall, and generate never
    # connects, so this job needs no database.
    quality:
        name: lint, typecheck & build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build

    # Every route suite runs against a real database, so the job has one. The
    # migrations in prisma/migrations are SQL nothing else checks: applying
    # them to an empty Postgres and diffing the result against schema.prisma is
    # the only thing that proves they still describe the schema the code
    # expects.
    test:
        name: migrations & test
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: jwt_prisma_backend_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d jwt_prisma_backend_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # The same database .env.test names, so the deploy below and the
            # suite cannot disagree about which one they mean.
            NODE_ENV: test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            # deploy, not dev: CI applies the committed migrations and fails if
            # they do not describe the schema the code expects.
            - run: npm run db:deploy
            # `--exit-code` returns 2 when the database the migrations built
            # differs from schema.prisma, which is what a schema edit nobody
            # generated a migration for looks like.
            - name: Check the schema matches the migrations
              run: >-
                  npx prisma migrate diff
                  --from-config-datasource
                  --to-schema prisma/schema.prisma
                  --exit-code
            - run: npm test
