# Lints, format-checks, builds and tests the project.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: CI
on:
    push:
        branches: ["master", "main", "dev"]
        paths-ignore:
            - "**.md"
    pull_request:
        branches: ["master", "main", "dev"]
        paths-ignore:
            - "**.md"
    workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Lint, format check and build once, on the project's pinned Node version.
    quality:
        name: lint & build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - name: Lint
              run: npm run lint
            - name: Check formatting
              run: npm run format:check
            - name: Build
              run: npm run build

    # Tests across supported Node versions.
    test:
        name: test (node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [24.x]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm test
