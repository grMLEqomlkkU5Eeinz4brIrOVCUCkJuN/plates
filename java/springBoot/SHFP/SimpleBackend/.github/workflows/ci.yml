name: CI
on:
  push:
    branches: ["master", "main", "dev"]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: ["master", "main", "dev"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # The suite starts its own Postgres through Testcontainers, so there is no
      # service container here and no second copy of the connection settings.
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the Dockerfile still builds. Nothing is pushed.
      - run: docker build --tag simplebackend:${{ github.sha }} .
