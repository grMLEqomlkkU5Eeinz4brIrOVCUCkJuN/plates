spring.application.name=SimpleBackend

# No defaults here on purpose: an unset DB_* variable must stop the boot with a
# named placeholder rather than fall back to a local development database.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.pool-name=simplebackend-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
# Fail a request that cannot get a connection in 3s instead of letting callers
# queue behind an exhausted pool until their own timeouts fire.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
# 29 minutes, under the 30 minute idle cut that most cloud load balancers and
# NAT gateways apply to an established TCP connection.
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.keepalive-time=300000
# Server side deadlines. A client that disconnects cannot leave a query running,
# and a transaction abandoned mid-flight releases its locks after 10s.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'; SET idle_in_transaction_session_timeout = '10s'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject bodies carrying fields no endpoint declares, so a typo fails loudly and
# an attempt to set a field the request record does not expose cannot pass.
spring.jackson.deserialization.fail-on-unknown-properties=true

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
# 50 request threads against a pool of 10 connections: enough to absorb a burst,
# few enough that the pool stays the thing that limits load on Postgres.
server.tomcat.threads.max=50
server.tomcat.accept-count=100
server.tomcat.max-connections=2000
server.tomcat.connection-timeout=10s
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=8KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Separate port so health, metrics and anything added later can be firewalled
# off from the public listener without a path based rule.
management.server.port=8081
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Liveness deliberately omits the database: losing Postgres must not make the
# orchestrator restart every instance while Postgres is already struggling.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

logging.pattern.correlation=[%X{requestId:-}] 
# Hibernate logs the driver's message at WARN for every constraint violation, and
# that message repeats the value that collided ("Key (email)=(someone@example.com)").
# A duplicate signup is an expected 409 that the handler already reports without
# the value, so this stops a routine path from streaming addresses into the logs.
# An integrity failure the service does not expect still reaches the log through
# the advice's own ERROR line, with the cause attached.
logging.level.org.hibernate.orm.jdbc.error=ERROR\ 

springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs

api.cors-allowed-origins=
api.rate-limit.enabled=true
api.rate-limit.permits-per-minute=120
api.rate-limit.burst-capacity=30
api.rate-limit.max-tracked-clients=50000
# X-Forwarded-For is client controlled unless a proxy you trust overwrites it.
# Turn this on only when every request reaches this service through such a proxy.
api.rate-limit.trust-forwarded-for=false
api.max-request-body-bytes=65536
